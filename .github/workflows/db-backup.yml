name: Database backup (RISK-0055 mitigation)

# CLM-0405 · M6-18B — RISK-0055 partial mitigation.
#
# RISK-0055: Supabase Free plan has no PITR and no listed backups.
# Database loss = loss since project creation. This workflow provides a
# scheduled, encrypted, restore-tested logical backup as a mitigation layer
# without upgrading the Supabase plan.
#
# RPO: ~6 hours (cron every 6h). RTO: measured per restore test.
# This does NOT close RISK-0055 — it moves it from "no mechanism" to
# "scheduled logical backup with restore proof".
#
# Secrets required (fail-closed if missing):
#   SUPABASE_DB_URL    — PostgreSQL connection string (pooler)
#   BACKUP_PASSPHRASE  — GPG symmetric encryption passphrase
#
# Security:
#   - No secrets in git or logs (connection string masked, passphrase never printed)
#   - Dump is compressed then GPG-encrypted before upload
#   - No unencrypted dump leaves the runner
#   - Artifact retention: 30 days
#
# Validation:
#   - Empty or invalid dump fails the workflow
#   - pg_restore --list verifies the dump is readable
#
# Correction by addition (CLM-0415, 2026-09-30): the "restore-tested" claim
# above was not a gate at bc5de79 — mismatches only warned, pg_restore errors
# were swallowed (`|| true`), the manifest always wrote restore_all_match=false
# (case-mismatched env keys), source rows were counted from the live DB after
# the dump, and `skip_restore_test` could skip verification. All steps below
# now run scripts/ops/db-backup/backup.sh, which fails closed at every stage
# (see its header). No skip input remains. A failed run is a failed backup.
#
# Not claimed:
#   - This is NOT PITR (no WAL replay, no point-in-time granularity)
#   - RPO is 6h, not the 5min target of ADR-052 T1
#   - Retention is 30 days (GitHub Actions artifact limit), not 7+ years
#   - Does not replace Supabase managed backups when PITR is enabled

on:
  schedule:
    # Every 6 hours at :00 — 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0/6 * * *'
  # CLM-0415: no inputs — the `skip_restore_test` switch is removed (defect g).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  PG_VERSION: '17'
  NODE_VERSION: '20.20.1'
  PNPM_VERSION: '9.15.9'

jobs:
  backup:
    name: Encrypted database backup (fail-closed)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require secrets (fail-closed)
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_DB_URL secret is missing — backup cannot proceed."
            exit 1
          fi
          if [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is missing — backup cannot proceed."
            exit 1
          fi
          echo "Secrets present (values not printed)."

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm and install (snapshot-dump.mjs needs `pg`)
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm install --frozen-lockfile

      - name: Install PostgreSQL client tools
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_VERSION}" >/dev/null
          BIN="/usr/lib/postgresql/${PG_VERSION}/bin"
          INSTALLED_VERSION=$("${BIN}/pg_dump" --version | grep -oP 'pg_dump \(PostgreSQL\) \K[0-9]+')
          if [ "${INSTALLED_VERSION}" != "${PG_VERSION}" ]; then
            echo "::error::pg_dump version ${INSTALLED_VERSION} does not match required ${PG_VERSION}."
            exit 1
          fi
          echo "${BIN}" >> "$GITHUB_PATH"

      - name: Snapshot dump → encrypt → decrypt artifact → restore → exact compare
        id: backup
        env:
          BACKUP_SOURCE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/ops/db-backup/backup.sh out

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.backup.outputs.timestamp }}
          path: |
            ${{ steps.backup.outputs.encrypted_file }}
            out/backup-manifest.json
          if-no-files-found: error
          retention-days: 30
