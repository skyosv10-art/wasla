# gemini-review.yml — مراجعةٌ إرشاديّةٌ بفعلٍ خارجيٍّ (قرارُ المالكِ · 2d604c4)
#
# ── تصلّبُ سلسلةِ التوريدِ (M0-31 · CLM-0152) ────────────────────────────
# هذا هو **سيرُ العملِ الوحيدُ** في المستودعِ الذي يرى سرّاً ويملكُ صلاحيّةَ
# كتابةٍ، ويجري على **كلِّ** طلبِ دمجٍ. وكانَ مربوطاً بالوسمِ المتحرِّكِ `@v2`،
# ومَن يملكُ تحريكَ ذلكَ الوسمِ في مستودعِ طرفٍ ثالثٍ (مقيسٌ: عامٌّ · ستُّ
# نجماتٍ · آخرُ دفعةٍ 2026-02-26) يُشغِّلُ شفرتَه بـ`GEMINI_API_KEY` وبصلاحيّةِ
# `pull-requests: write`. فثُبِّتَ ببصمةِ الالتزامِ الكاملةِ التي كانَ الوسمُ
# يشيرُ إليها لحظةَ القياسِ، والوسمُ مكتوبٌ في تعليقٍ لاحقٍ ليبقى مقروءاً.
#
# وأُضيفت كتلةُ `permissions` على مستوى الملفِّ بأقلِّ صلاحيّةٍ، فلا يُوَرَّثُ
# الافتراضيُّ للمستودعِ إلى أيِّ وظيفةٍ تُضافُ لاحقاً هنا.
#
# وخطرٌ متبقٍّ **مُعلَنٌ لا مكتومٌ**: التثبيتُ يمنعُ تغييرَ الشفرةِ من تحتِنا،
# ولا يُحوِّلُ فعلاً من طرفٍ ثالثٍ إلى موثوقٍ. والرفعُ إلى بصمةٍ أحدثَ قرارُ
# مراجعةٍ لا تحديثٌ تلقائيٌّ. وهذا السيرُ **إرشاديٌّ**: ليسَ في
# `MERGE_BLOCKING.json` ولا يُلزِمُ دمجاً.
#
# الحارسُ: scripts/checks/validate-workflow-supply-chain.sh
name: Gemini Code Review
on: [pull_request]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Gemini Code Reviewer
        uses: sshnaidm/gemini-code-review-action@ecc2434351ef76b0084b788a3d61ec7d3acf44f9 # v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
