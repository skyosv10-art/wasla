name: RISK-0056 apply (PRODUCTION — manual, gated)

# CLM-0420 · §24-A — the ONLY path that writes the 14 schemas to production.
#   · workflow_dispatch only, from `main` only (guard + Environment branch policy);
#   · the operator types the FULL commit SHA and the sha256 of the schema manifest —
#     a run on any other commit or manifest stops before any database is touched;
#   · a fail-closed, restore-verified, pre-migration backup (90-day retention) is in
#     `needs` — the apply job cannot start unless that backup succeeded in THIS run;
#   · Environment `production-migration`: required reviewer, self-review prevented,
#     `main` only. The database secret exists ONLY in that environment:
#     PRODUCTION_MIGRATION_DB_URL (session pooler, port 5432);
#   · lock_timeout is set and read back on the migration's only session
#     (lock-timeout-preload.mjs); first failure stops the run.
# `mode: preflight` runs the guards and a read-only inventory and writes nothing.
# Proven on TEST + fresh PostgreSQL 17 by risk-0056-apply-proof.yml (same apply.sh).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight (read-only) or apply"
        type: choice
        options: [preflight, apply]
        default: preflight
      confirm_sha:
        description: "Full 40-character SHA of the main commit to apply (must equal the run's commit)"
        type: string
        required: true
      schema_manifest_sha256:
        description: "sha256 of scripts/ops/risk-0056/schema-sha256.txt at that commit"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: risk-0056-production
  cancel-in-progress: false

env:
  NODE_VERSION: "20.20.1"
  PNPM_VERSION: "9.15.9"

jobs:
  guard:
    name: Guard — main, exact SHA, exact manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Refuse anything but the typed commit on main
        env:
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
          MANIFEST_SHA: ${{ inputs.schema_manifest_sha256 }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::ref $GITHUB_REF is not refs/heads/main"; exit 1; }
          [[ "$CONFIRM_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::confirm_sha must be a full 40-character lowercase SHA"; exit 1; }
          [ "$CONFIRM_SHA" = "$GITHUB_SHA" ] || { echo "::error::confirm_sha $CONFIRM_SHA != run commit $GITHUB_SHA"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "::error::checkout is not the run commit"; exit 1; }
          got="$(sha256sum scripts/ops/risk-0056/schema-sha256.txt | cut -d' ' -f1)"
          [ "$got" = "$MANIFEST_SHA" ] || { echo "::error::manifest sha256 $got != typed $MANIFEST_SHA"; exit 1; }
          grep -v '^#' scripts/ops/risk-0056/schema-sha256.txt | sha256sum -c --quiet
          echo "guard: main @ $GITHUB_SHA · manifest $got · 14/14 schema.sql match"

  backup:
    name: Pre-migration backup (fail-closed, restore-verified)
    needs: guard
    if: ${{ inputs.mode == 'apply' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/db-backup.yml
    with:
      pre_migration: true
      expect_project_ref: snlpxywskyqrjattbpgn
    secrets:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

  apply:
    name: ${{ inputs.mode }} on production (Environment production-migration)
    needs: [guard, backup]
    if: ${{ always() && needs.guard.result == 'success' && (inputs.mode == 'preflight' || needs.backup.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-migration
    env:
      RISK0056_DB_URL: ${{ secrets.PRODUCTION_MIGRATION_DB_URL }}
      RISK0056_TARGET: production
      RISK0056_MODE: ${{ inputs.mode }}
      RISK0056_OUT: out
      RISK0056_LOCK_TIMEOUT: 5s
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Require the environment secret (fail-closed)
        run: |
          [ -n "$RISK0056_DB_URL" ] || { echo "::error::PRODUCTION_MIGRATION_DB_URL is not set in Environment production-migration"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || exit 1
          echo "secret present (value not printed) · backup job: ${{ needs.backup.result }}"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pinned pnpm and install
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm install --frozen-lockfile
      - name: apply.sh (guards → manifest → read-only preflight → 14 migrations → postflight)
        run: bash scripts/ops/risk-0056/apply.sh
      - name: Upload evidence (no URLs, no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-0056-${{ inputs.mode }}-${{ github.run_id }}
          path: out/*.json*
          if-no-files-found: warn
          retention-days: 90
