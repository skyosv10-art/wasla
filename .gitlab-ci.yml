# .gitlab-ci.yml — WASLA validation pipeline
# Stages: validate (بنية المستودع/الأسرار/الوثائق) + build (typecheck/test).
# shared runners مُفعّلة (2026-08-20) وكل الوظائف تنفّذ فعلياً على main وعلى MRs.

stages:
  - validate
  - build

variables:
  GIT_DEPTH: "1"

# التحقق من وجود الملفات الإلزامية لكل مستودع وقواعد المستودع.
repo-structure:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash
  script:
    - |
      set -e
      echo "==> فحص وجود الملفات الإلزامية في جذر المستودع"
      for f in README.md CONTRIBUTING.md SECURITY.md CODEOWNERS .gitignore; do
        if [ ! -f "$f" ]; then
          echo "ERROR: ملف إلزامي مفقود: $f"
          exit 1
        fi
        echo "OK: $f"
      done

      echo "==> فحص وجود أدلة المستودع الأساسية"
      for d in apps bots services packages infra scripts docs; do
        if [ ! -d "$d" ]; then
          echo "ERROR: دليل إلزامي مفقود: $d"
          exit 1
        fi
        echo "OK: $d/"
      done

      echo "==> فحص وجود قوانين docs/00-rules"
      for f in docs/00-rules/ENGINEERING_DOCUMENTATION_LAW.md \
               docs/00-rules/DEFINITION_OF_DONE.md \
               docs/00-rules/GIT_RULES.md \
               docs/00-rules/SECURITY_RULES.md; do
        if [ ! -f "$f" ]; then
          echo "ERROR: قانون إلزامي مفقود: $f"
          exit 1
        fi
        echo "OK: $f"
      done

      echo "==> فحص وجود لوحة التقدم و ADR"
      test -f docs/16-progress/MASTER_PROGRESS.md || { echo "ERROR: MASTER_PROGRESS.md مفقود"; exit 1; }
      test -f docs/15-decisions/ADR-001-identity-decoupled-from-telegram.md || { echo "ERROR: ADR-001 مفقود"; exit 1; }
      echo "OK: docs/16-progress/MASTER_PROGRESS.md"
      echo "OK: docs/15-decisions/ADR-001"

      echo "==> فحص عدم وجود أسرار في المستودع"
      if [ ! -x scripts/checks/scan-secrets.sh ]; then
        echo "ERROR: scripts/checks/scan-secrets.sh غير قابل للتنفيذ" >&2
        exit 1
      fi
      bash scripts/checks/scan-secrets.sh
      echo "OK: لا أنماط أسرار واضحة"

      echo "==> جميع فحوصات بنية المستودع نجحت"

# فحص قواعد Markdown (اختياري — يتجاهل إذا لم تتوفر الأداة).
markdown-lint:
  stage: validate
  image: alpine:3.20
  allow_failure: true
  before_script:
    - apk add --no-cache nodejs npm
    - npm install -g markdownlint-cli2 || true
  script:
    - |
      if command -v markdownlint-cli2 >/dev/null 2>&1; then
        markdownlint-cli2 "README.md" "CONTRIBUTING.md" "SECURITY.md" "docs/**/*.md" || true
      else
        echo "markdownlint-cli2 غير متوفر، تخطي الفحص (allow_failure)"
      fi

# ─────────────────────────────────────────────────────────────────────
# قاعدة التوثيق مع كل دفع (PUSH_DOCUMENTATION_RULE).
# إلزام خادمي: أي MR يمس الكود يجب أن يلمس docs/ أيضاً. وإلا FAIL.
# ─────────────────────────────────────────────────────────────────────
doc-coverage:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash git
    - |
      TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}"
      git fetch origin "$TARGET:refs/remotes/origin/$TARGET" --depth=50 2>/dev/null || true
  script:
    - |
      TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}"
      bash scripts/checks/require-doc-update.sh "origin/$TARGET" HEAD
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ─────────────────────────────────────────────────────────────────────
# بناء واختبار (Phase 00 build/test foundation — ADR-003).
# يتطلب Node 20 + pnpm 9 (عبر corepack). ينفّذ typecheck و test لكل الحزم.
# ─────────────────────────────────────────────────────────────────────
build-test:
  stage: build
  image: node:20-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm -r run typecheck
    - pnpm -r run test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ─────────────────────────────────────────────────────────────────────
# اختبارات تكامل Postgres (Phase 01 MR 4 + Phase 02 MR 6).
# قاعدة مشتركة: node:20-alpine + pnpm 9 + تثبيت مُجمّد. كل خدمة تملك وظيفتها
# وقاعدة بياناتها المستقلّة حتى يكون الفشل مُنسَباً لخدمة واحدة ولا تتداخل
# جداول خدمة مع أخرى. الاختبارات نفسها تُطبّق `contracts/schema.sql` الكنسي.
# منفصلة عن build-test (الذي لا يحتاج DB) حتى يبقى الافتراضي أخضر دون قاعدة.
# ─────────────────────────────────────────────────────────────────────
.db-integration-base:
  stage: build
  image: node:20-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Identity (Phase 01 Exit Gate persistence verification):
# services/identity/src/__tests__/postgres-repository.integration.test.ts
db-integration:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_test"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/identity-service test:integration

