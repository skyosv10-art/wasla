# WASLA Alertmanager config — M6-18C (CLM-0403)
#
# Destination: Telegram, primary on-call = driver bot (OBSERVABILITY_OPERATING_MODEL.md §4).
# This file is a TEMPLATE. `alertmanager-entrypoint.sh` substitutes
# __TELEGRAM_CHAT_ID__ at start-up from the Render env var TELEGRAM_CHAT_ID and
# writes the token from TELEGRAM_BOT_TOKEN to a file — no secret is committed.
# A missing variable stops the container (fail closed). A receiver that silently
# drops every alert is worse than a down Alertmanager, because only the down one is
# visible.

global:
  resolve_timeout: 5m

route:
  receiver: "telegram-oncall"
  group_by: ["alertname", "instance", "severity"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: "telegram-oncall"
    telegram_configs:
      - bot_token_file: /tmp/alertmanager/telegram_token
        chat_id: __TELEGRAM_CHAT_ID__
        send_resolved: true
        parse_mode: ""
