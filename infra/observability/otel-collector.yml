# WASLA OTLP Collector config (M2-08 Stage B)
# ADR-041: Receives OpenTelemetry traces from WASLA services.
#
# The collector runs as a standalone Render web service.
# Services set OTEL_EXPORTER_OTLP_ENDPOINT to the collector's URL.
# Traces are logged to stdout for staging verification.
# Production should export to Jaeger/Tempo (deferred).

receivers:
  otlp:
    protocols:
      http:
        # The collector has no ${env:VAR:-default} syntax: "PORT:-4318" was parsed
        # as a variable name and the config was rejected (update_failed 2026-09-24).
        # Render always sets PORT. For local runs, export PORT=4318.
        endpoint: "0.0.0.0:${env:PORT}"

processors:
  batch:
    timeout: 5s
    send_batch_size: 256

exporters:
  # Log traces to stdout for staging verification
  debug:
    verbosity: detailed
  # Production exporter (commented — requires backend)
  # otlp/jaeger:
  #   endpoint: "jaeger:4317"
  #   tls:
  #     insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
  telemetry:
    logs:
      level: info
