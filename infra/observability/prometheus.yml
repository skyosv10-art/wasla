# WASLA Observability — Prometheus scrape config TEMPLATE (M2-08 Stage B · CLM-0499 · ADR-068)
# Scrapes /metrics from the 14 HTTP services of ONE Render environment.
#
# This file holds NO hostnames. The entrypoint renders it from
# infra/observability/targets/<WASLA_OBS_ENVIRONMENT>.targets:
#   __ALERTING__        → the Alertmanager block, or `alertmanagers: []` when the
#                         environment does not own paging (`alertmanager none`)
#   __SERVICE_TARGETS__ → one `- "<host>"` line per `service` entry
#   __ENVIRONMENT__     → the environment name (label)
#   __PORT__            → the listen port
# Guard: scripts/checks/validate-observability-targets.sh renders every environment.
#
# Services sleep after 15 min idle (Render Free/Starter). Scrape interval
# is 30s to catch metrics during active periods. honor_labels: true so
# service-set labels (service, method, route, status) are preserved.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - "alert-rules.yml"

alerting:
__ALERTING__

scrape_configs:
  # ── WASLA HTTP Services (14) ──────────────────────────────────────────
  - job_name: "wasla-services"
    metrics_path: /metrics
    # Render serves HTTPS on 443; the default http scheme reached port 80.
    scheme: https
    scrape_interval: 30s
    honor_labels: true
    static_configs:
      - targets:
__SERVICE_TARGETS__
        labels:
          environment: __ENVIRONMENT__
          platform: render

  # ── Prometheus self-monitoring ────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:__PORT__"
